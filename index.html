<body style="margin:0;background:#0a0f1e;">
  <div id="root"></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ─── Colour palette (soothing blue theme) ────────────────────────────────────
const BG       = "#0a0f1e";   // deep navy background
const BG2      = "#111827";   // card background
const BG3      = "#1a2235";   // subtle panel
const BORDER   = "#1e293b";   // border
const BORDER2  = "#253147";   // slightly lighter border
const BLUE     = "#3b82f6";   // primary blue (working)
const BLUE_L   = "#1d4ed8";   // darker blue
const BLUE_DIM = "rgba(59,130,246,0.12)"; // not-working tint
const BLUE_GLOW= "rgba(59,130,246,0.25)";
const TEXT     = "#e2e8f0";   // primary text
const TEXT2    = "#94a3b8";   // secondary text
const TEXT3    = "#475569";   // dim text
const GREEN    = "#34d399";   // success / both-off
const ORANGE   = "#fb923c";   // partner accent
const PURPLE   = "#a78bfa";   // sleepover

// ─── Helpers ─────────────────────────────────────────────────────────────────
const toMins = t => { if (!t) return 0; const [h,m] = t.split(":").map(Number); return h*60+m; };
const toHours = m => Math.round(m/60*100)/100;
const fmtHours = h => {
  const hrs = Math.floor(h), mins = Math.round((h-hrs)*60);
  if (!hrs && !mins) return "0h";
  if (!hrs) return `${mins}m`;
  if (!mins) return `${hrs}h`;
  return `${hrs}h ${mins}m`;
};
const fmtGBP = n => new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP"}).format(n);
const dayName = d => new Date(d+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short"});
const localDate = (d=new Date()) => {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEK_DAYS = [{v:1,l:"Mon"},{v:2,l:"Tue"},{v:3,l:"Wed"},{v:4,l:"Thu"},{v:5,l:"Fri"},{v:6,l:"Sat"},{v:0,l:"Sun"}];
const uuid = () => Math.random().toString(36).slice(2);
const getWeekKey = (date, wsd=1) => {
  const ds = typeof date==='string' && date.length===10 ? date+"T00:00:00" : date;
  const d = new Date(ds); d.setHours(0,0,0,0);
  const diff = (d.getDay()-wsd+7)%7; d.setDate(d.getDate()-diff);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
const getWeekDates = wk => Array.from({length:7},(_,i)=>{
  const d = new Date(wk+"T00:00:00"); d.setDate(d.getDate()+i);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
});
const weekLabel = wk => {
  const s=new Date(wk+"T00:00:00"), e=new Date(wk+"T00:00:00"); e.setDate(e.getDate()+6);
  return `${s.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${e.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`;
};
const shiftHours = s => {
  if (!s.working||!s.startTime||!s.endTime) return 0;
  let a=toMins(s.startTime), b=toMins(s.endTime);
  if (b<=a) b+=1440;
  return toHours(b-a);
};
const shiftPay = (s,rate) => shiftHours(s)*rate + (s.hasSleepover ? s.sleepoversRate||60 : 0);
const getDaysInMonth = (y,m) => new Date(y,m+1,0).getDate();
const load = (k,d) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch { return d; } };
const save = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };

const DEFAULT_MY_AGENCIES = [
  {id:"a1",name:"Workplace 1",rate:12.68,color:BLUE},
  {id:"a2",name:"Workplace 2",rate:12.65,color:"#60a5fa"}
];
const DEFAULT_PARTNER_AGENCIES = [
  {id:"p1",name:"Workplace 1",rate:11.50,color:GREEN},
  {id:"p2",name:"Workplace 2",rate:11.50,color:"#6ee7b7"}
];
const DEFAULT_PREFS = {weekStartDay:1,appName:"Shifto",partnerName:"Partner"};
const blankShift = aid => ({
  id:uuid(), agencyId:aid, working:false,
  startTime:"", endTime:"", note:"",
  hasSleepover:false, sleepoversRate:60,
  slpStart:"", slpEnd:"", continuesNext:false
});

// ─── Google Drive ─────────────────────────────────────────────────────────────
const CLIENT_ID = "172131256633-k2eod5od16tdo7qeqd64lml0rf8up6op.apps.googleusercontent.com";
const gDrive = {
  _token:null, _signedIn:false,
  async token(silent=false) {
    if (this._token && this._token.exp>Date.now()) return this._token.tok;
    return new Promise((res,rej)=>{
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID,
        scope:"https://www.googleapis.com/auth/drive.appdata",
        callback: r=>{
          if (r.error) return rej(r.error);
          this._token={tok:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};
          this._signedIn=true; res(r.access_token);
        }
      });
      client.requestAccessToken({prompt:silent?"none":""});
    });
  },
  async save(data) {
    const t=await this.token(), j=JSON.stringify(data);
    const q=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'shifto-backup.json'&fields=files(id)",{headers:{Authorization:"Bearer "+t}});
    const found=await q.json(), id=found.files?.[0]?.id;
    const meta=id?{name:"shifto-backup.json"}:{name:"shifto-backup.json",parents:["appDataFolder"]};
    const form=new FormData();
    form.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"}));
    form.append("file",new Blob([j],{type:"application/json"}));
    const r=await fetch(id?`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart`:"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
      {method:id?"PATCH":"POST",headers:{Authorization:"Bearer "+t},body:form});
    if (!r.ok) throw new Error("Save failed");
  },
  async load() {
    const t=await this.token();
    const q=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'shifto-backup.json'&fields=files(id)",{headers:{Authorization:"Bearer "+t}});
    const found=await q.json(), id=found.files?.[0]?.id;
    if (!id) return null;
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{Authorization:"Bearer "+t}});
    if (!r.ok) throw new Error("Load failed");
    return r.json();
  }
};

// ─── Auto-sync bridge ─────────────────────────────────────────────────────────
let _autoSyncFn = null;
const registerAutoSync = fn => { _autoSyncFn = fn; };
const triggerAutoSync = () => { if (_autoSyncFn) _autoSyncFn(); };

// ─── Base Components ──────────────────────────────────────────────────────────
const C = ({children,style}) => React.createElement("div",{style:{background:BG2,borderRadius:14,padding:"14px 16px",marginBottom:10,border:`1px solid ${BORDER}`,...style}},children);
const SL = ({children}) => React.createElement("div",{style:{fontSize:11,fontWeight:700,color:TEXT3,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:8,marginTop:20,fontFamily:"'DM Sans',sans-serif"}},children);
const FL = ({children}) => React.createElement("div",{style:{fontSize:11,fontWeight:700,color:TEXT3,letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:5,fontFamily:"'DM Sans',sans-serif"}},children);
const In = ({style,...p}) => React.createElement("input",{...p,style:{background:BG,border:`1px solid ${BORDER2}`,borderRadius:10,color:TEXT,padding:"10px 12px",fontSize:15,width:"100%",boxSizing:"border-box",fontFamily:"'DM Sans',sans-serif",outline:"none",WebkitAppearance:"none",...style}});

// ─── Tab Bar ──────────────────────────────────────────────────────────────────
const TabBar = ({active,onChange,tabs}) => React.createElement("div",{style:{display:"flex",background:BG2,borderTop:`1px solid ${BORDER}`,position:"fixed",bottom:0,left:0,right:0,zIndex:100,paddingBottom:"env(safe-area-inset-bottom,0px)",maxWidth:430,margin:"0 auto"}},
  tabs.map(t=>React.createElement("button",{key:t.id,onClick:()=>onChange(t.id),style:{flex:1,padding:"10px 2px 8px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,color:active===t.id?BLUE:TEXT3,transition:"all 0.18s"}},
    React.createElement("span",{style:{fontSize:20}},t.icon),
    React.createElement("span",{style:{fontSize:9,fontFamily:"'DM Sans',sans-serif",fontWeight:700,letterSpacing:"0.03em"}},t.label)
  ))
);

// ─── App Header ───────────────────────────────────────────────────────────────
const AppHeader = ({appName,myAgencies,partnerAgencies,tab,onTabChange}) => {
  const today = new Date();
  const dayStr = today.toLocaleDateString("en-GB",{weekday:"long"});
  const dateStr = today.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const name = appName||"Shifto";
  const tabLabels = {week:"My Shifts",partner:"Partner",reports:"Reports",settings:"Settings"};
  return React.createElement("div",{style:{paddingTop:"env(safe-area-inset-top,44px)",background:BG2,borderBottom:`1px solid ${BORDER}`,position:"fixed",top:0,left:0,right:0,zIndex:200,maxWidth:430,margin:"0 auto"}},
    React.createElement("div",{style:{padding:"8px 16px 0"}},
      React.createElement("div",{style:{display:"flex",alignItems:"center",marginBottom:10}},
        React.createElement("div",{style:{flex:1}},
          React.createElement("div",{style:{display:"flex",alignItems:"baseline",gap:1}},
            React.createElement("span",{style:{fontSize:26,fontWeight:900,color:TEXT,fontFamily:"'DM Sans',sans-serif",letterSpacing:"-0.04em"}},name.slice(0,-1)),
            React.createElement("span",{style:{fontSize:26,fontWeight:900,color:BLUE,fontFamily:"'DM Sans',sans-serif",letterSpacing:"-0.04em"}},name.slice(-1))
          ),
          React.createElement("div",{style:{fontSize:11,color:TEXT3,fontFamily:"'DM Sans',sans-serif",marginTop:1}},dayStr+", "+dateStr)
        ),
        React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:3,alignItems:"flex-end"}},
          (tab==="week"?myAgencies:tab==="partner"?partnerAgencies:[]).map(ag=>
            React.createElement("div",{key:ag.id,style:{display:"flex",alignItems:"center",gap:5}},
              React.createElement("span",{style:{fontSize:10,color:TEXT3,fontFamily:"'DM Sans',sans-serif",fontWeight:600}},ag.name),
              React.createElement("span",{style:{background:ag.color+"22",color:ag.color,fontSize:11,fontWeight:700,borderRadius:6,padding:"2px 8px",fontFamily:"'DM Mono',monospace"}},fmtGBP(ag.rate)+"/hr")
            )
          )
        )
      ),
      React.createElement("div",{style:{display:"flex"}},
        ["week","partner","reports","settings"].map(t=>
          React.createElement("div",{key:t,onClick:()=>onTabChange(t),style:{padding:"7px 10px 8px",fontSize:12,fontWeight:700,fontFamily:"'DM Sans',sans-serif",color:tab===t?BLUE:TEXT3,borderBottom:tab===t?`2px solid ${BLUE}`:"2px solid transparent",transition:"all 0.2s",marginBottom:-1,cursor:"pointer"}},tabLabels[t])
        )
      )
    )
  );
};

// ─── Delete Confirm ───────────────────────────────────────────────────────────
const DeleteConfirm = ({onDelete}) => {
  const [conf,setConf] = useState(false);
  return conf
    ? React.createElement("div",{style:{marginTop:12,background:"#1e0f0f",borderRadius:10,padding:"12px",border:"1px solid #4a1515"}},
        React.createElement("div",{style:{fontSize:12,color:"#e74c3c",fontFamily:"'DM Sans',sans-serif",marginBottom:10,fontWeight:600}},"Delete this workplace? All shift data will be lost."),
        React.createElement("div",{style:{display:"flex",gap:8}},
          React.createElement("button",{onClick:onDelete,style:{flex:1,padding:"9px",borderRadius:9,background:"#e74c3c",border:"none",color:"#fff",fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:13,cursor:"pointer"}},"Yes, delete"),
          React.createElement("button",{onClick:()=>setConf(false),style:{flex:1,padding:"9px",borderRadius:9,background:BG2,border:`1px solid ${BORDER}`,color:TEXT3,fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:13,cursor:"pointer"}},"Cancel")
        )
      )
    : React.createElement("button",{onClick:()=>setConf(true),style:{width:"100%",marginTop:10,padding:"9px",borderRadius:9,background:"none",border:"1px solid #2a1515",color:"#7a3030",fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:13,cursor:"pointer"}},"Delete this workplace");
};

// ─── Google Sync ──────────────────────────────────────────────────────────────
const GoogleSync = ({getData,onRestore}) => {
  const [status,setStatus] = useState(null);
  const [signedIn,setSignedIn] = useState(gDrive._signedIn);
  const [lastSync,setLastSync] = useState(()=>load("spt_last_sync",null));
  const [ready,setReady] = useState(false);
  const [autoEnabled,setAutoEnabled] = useState(()=>load("spt_auto_sync","false")==="true");

  useEffect(()=>{
    const t=setInterval(()=>{ if(window.google?.accounts?.oauth2){setReady(true);clearInterval(t);} },300);
    return ()=>clearInterval(t);
  },[]);

  useEffect(()=>{
    if (!ready||!autoEnabled) return;
    (async()=>{
      try {
        await gDrive.token(false); setSignedIn(true);
        setStatus("restoring");
        const d=await gDrive.load(); if(d) onRestore(d);
        setStatus("success"); setTimeout(()=>setStatus(null),2000);
      } catch { setStatus(null); }
    })();
  },[ready]);

  const doSync = async()=>{
    setStatus("syncing");
    try {
      await gDrive.save(getData());
      const n=new Date().toISOString(); setLastSync(n); save("spt_last_sync",n);
      setSignedIn(true); setStatus("success"); setTimeout(()=>setStatus(null),2000);
    } catch { setStatus("error"); setTimeout(()=>setStatus(null),4000); }
  };
  const doRestore = async()=>{
    setStatus("restoring");
    try {
      const d=await gDrive.load();
      if (!d){alert("No backup found in Google Drive.");setStatus(null);return;}
      onRestore(d); setSignedIn(true); setStatus("success"); setTimeout(()=>setStatus(null),2000);
    } catch { setStatus("error"); setTimeout(()=>setStatus(null),3000); }
  };
  const toggleAuto = ()=>{ const next=!autoEnabled; setAutoEnabled(next); save("spt_auto_sync",String(next)); };

  useEffect(()=>{
    registerAutoSync(async()=>{
      if (!autoEnabled||!gDrive._signedIn) return;
      try {
        await gDrive.save(getData());
        const n=new Date().toISOString(); setLastSync(n); save("spt_last_sync",n);
      } catch {}
    });
  },[autoEnabled,getData]);

  const fmtSync = lastSync?"Last synced: "+new Date(lastSync).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" "+new Date(lastSync).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"Never synced";
  const sc={success:GREEN,error:"#e74c3c",syncing:TEXT3,restoring:TEXT3}[status];
  const sm={syncing:"Syncing…",restoring:"Loading from Drive…",success:"Done ✓",error:"Something went wrong"}[status];
  const dis=!ready||!!status;

  return React.createElement("div",null,
    React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:12}},
      React.createElement("div",{style:{width:8,height:8,borderRadius:"50%",background:signedIn?GREEN:ready?ORANGE:"#555"}}),
      React.createElement("span",{style:{fontSize:12,color:TEXT3,fontFamily:"'DM Sans',sans-serif"}},!ready?"Loading…":signedIn?"Connected to Google":"Not signed in"),
      React.createElement("div",{style:{flex:1}}),
      React.createElement("span",{style:{fontSize:10,color:TEXT3,fontFamily:"'DM Sans',sans-serif"}},fmtSync)
    ),
    React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",background:BG,borderRadius:10,marginBottom:10,border:`1px solid ${BORDER}`}},
      React.createElement("div",null,
        React.createElement("div",{style:{fontSize:13,fontWeight:700,color:autoEnabled?GREEN:TEXT3,fontFamily:"'DM Sans',sans-serif"}},"Auto-sync"),
        React.createElement("div",{style:{fontSize:11,color:TEXT3,fontFamily:"'DM Sans',sans-serif"}},"Syncs when you save a shift")
      ),
      React.createElement("div",{onClick:toggleAuto,style:{width:44,height:26,borderRadius:13,background:autoEnabled?GREEN:"#1e293b",border:`2px solid ${autoEnabled?GREEN:BORDER2}`,cursor:"pointer",position:"relative",transition:"all 0.2s",flexShrink:0}},
        React.createElement("div",{style:{position:"absolute",top:3,left:autoEnabled?18:2,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}})
      )
    ),

        React.createElement("button",{onClick:()=>exportData(false),style:{flex:1,padding:"11px",borderRadius:10,background:"#0d2a1a",border:"1px solid #1a4a2a",color:GREEN,fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:13,cursor:"pointer"}},"⬇ Save to Files"),
        React.createElement("button",{onClick:()=>exportData(true),style:{flex:1,padding:"11px",borderRadius:10,background:`${BLUE}12`,border:`1px solid ${BLUE}33`,color:BLUE,fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:13,cursor:"pointer"}},"✉ Email Backup")
      ),
      React.createElement("label",{style:{padding:"11px",borderRadius:10,background:`${BLUE}12`,border:`1px solid ${BLUE}33`,color:BLUE,fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:13,cursor:"pointer",textAlign:"center",display:"block"}},
        "⬆ Import Backup",
        React.createElement("input",{type:"file",accept:".json",style:{display:"none"},onChange:e=>{const f=e.target.files[0];if(f)importData(f);e.target.value="";}})
      ),
      importStatus&&React.createElement("div",{style:{marginTop:10,fontSize:12,color:importStatus==="success"?GREEN:"#e74c3c",fontFamily:"'DM Sans',sans-serif",textAlign:"center"}},importStatus==="success"?"✓ Restored successfully":"✕ Invalid file")
    ),
    React.createElement(SL,null,"About"),
    React.createElement(C,{style:{padding:"12px 14px"}},
      React.createElement("div",{style:{fontSize:12,color:TEXT3,fontFamily:"'DM Sans',sans-serif",lineHeight:1.8}},
        React.createElement("div",{style:{color:TEXT2,fontWeight:700,marginBottom:2}},prefs.appName," · Shift & Pay Tracker"),
        "Tracks shifts for you and your partner · Google Drive sync · Works offline"
      )
    )
  );
};

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [myAgencies,setMyAgencies] = useState(()=>{
    const saved=load("spt_agencies",DEFAULT_MY_AGENCIES);
    return saved.map(ag=>({...ag,name:ag.name.replace(/^Agency (\d+)$/,"Workplace $1")}));
  });
  const [myShifts,setMyShifts] = useState(()=>load("spt_shifts",{}));
  const [partnerAgencies,setPartnerAgencies] = useState(()=>{
    const saved=load("spt_partner_agencies",DEFAULT_PARTNER_AGENCIES);
    return saved.map(ag=>({...ag,name:ag.name.replace(/^(Agency|Carehome) (\d+)$/,"Workplace $2")}));
  });
  const [partnerShifts,setPartnerShifts] = useState(()=>load("spt_partner_shifts",{}));
  const [prefs,setPrefs] = useState(()=>{
    const p=load("spt_prefs",null);
    if (!p) return DEFAULT_PREFS;
    return {...DEFAULT_PREFS,...p,weekStartDay:typeof p.weekStartDay==="number"?p.weekStartDay:DEFAULT_PREFS.weekStartDay};
  });
  const [tab,setTab] = useState("week");
  const TABS_LIST = useMemo(()=>[
    {id:"week",icon:"📋",label:"Timesheet"},
    {id:"partner",icon:"👫",label:prefs.partnerName||"Partner"},
    {id:"reports",icon:"📊",label:"Reports"},
    {id:"settings",icon:"⚙️",label:"Settings"}
  ],[prefs.partnerName]);

  useEffect(()=>{ save("spt_agencies",myAgencies); },[myAgencies]);
  useEffect(()=>{ save("spt_shifts",myShifts); triggerAutoSync(); },[myShifts]);
  useEffect(()=>{ save("spt_partner_agencies",partnerAgencies); },[partnerAgencies]);
  useEffect(()=>{ save("spt_partner_shifts",partnerShifts); triggerAutoSync(); },[partnerShifts]);
  useEffect(()=>{ save("spt_prefs",prefs); },[prefs]);

  const PARTNER_PRESETS = [{label:"7–7",start:"07:00",end:"19:00"},{label:"7–1",start:"07:00",end:"13:00"}];

  const getAllData = () => ({
    version:2, exportedAt:new Date().toISOString(),
    myAgencies, myShifts, partnerAgencies, partnerShifts, prefs,
    agencies:myAgencies, shifts:myShifts
  });
  const onRestore = data => {
    if (data.myAgencies) setMyAgencies(data.myAgencies); else if (data.agencies) setMyAgencies(data.agencies);
    if (data.myShifts) setMyShifts(data.myShifts); else if (data.shifts) setMyShifts(data.shifts);
    if (data.partnerAgencies) setPartnerAgencies(data.partnerAgencies);
    if (data.partnerShifts) setPartnerShifts(data.partnerShifts);
    if (data.prefs) setPrefs(data.prefs);
  };

  const headerHeight = "calc(env(safe-area-inset-top, 44px) + 96px)";

  return React.createElement(React.Fragment,null,
    React.createElement("style",null,`
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&family=DM+Mono:wght@400;500;700&display=swap');
      *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
      html,body{height:100%;background:${BG};color:${TEXT};overflow-x:hidden;}
      input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(0.35);}
      select option{background:${BG2};}
      ::-webkit-scrollbar{width:0;}
      #root{height:100%;}
    `),
    React.createElement("div",{style:{maxWidth:430,margin:"0 auto",minHeight:"100dvh",background:BG}},
      React.createElement(AppHeader,{appName:prefs.appName||"Shifto",myAgencies,partnerAgencies,tab,onTabChange:setTab}),
      React.createElement("div",{style:{position:"fixed",top:headerHeight,bottom:"calc(env(safe-area-inset-bottom,0px) + 58px)",left:0,right:0,maxWidth:430,margin:"0 auto",display:"flex",flexDirection:"column",overflow:"hidden"}},
        tab==="week"&&React.createElement(WeeklyView,{key:prefs.weekStartDay,agencies:myAgencies,shifts:myShifts,setShifts:setMyShifts,weekStartDay:prefs.weekStartDay,accentColor:BLUE}),
        tab==="partner"&&React.createElement(WeeklyView,{key:`p${prefs.weekStartDay}`,agencies:partnerAgencies,shifts:partnerShifts,setShifts:setPartnerShifts,weekStartDay:prefs.weekStartDay,accentColor:ORANGE,presets:PARTNER_PRESETS}),
        tab==="reports"&&React.createElement(ReportsView,{myAgencies,myShifts,partnerAgencies,partnerShifts,weekStartDay:prefs.weekStartDay,partnerName:prefs.partnerName}),
        tab==="settings"&&React.createElement(SettingsView,{myAgencies,setMyAgencies,partnerAgencies,setPartnerAgencies,shifts:myShifts,setShifts:setMyShifts,partnerShifts,setPartnerShifts,prefs,setPrefs,getAllData,onRestore})
      ),
      React.createElement(TabBar,{active:tab,onChange:setTab,tabs:TABS_LIST})
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
  </script>
</body>
</html>
